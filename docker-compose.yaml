services:
  # Backend Service (Go)
  backend:
    build:
      context: ./url-analyzer-be
      dockerfile: Dockerfile
      args:
        APP_PATH: ./cmd/http/main.go
    container_name: url-analyzer-be
    ports:
      - "8080:8080" 
    environment:
      - PORT=8080                    # Application HTTP server listening port
      - ENV=dev                      # Runtime environment mode (e.g., dev, staging, prod)
      - SCRAPE_TIMEOUT=20s           # Maximum duration allowed per URL HTTP scraping request
      - MAX_HTTP_BATCH_CONCURRENCY=10 # Max concurrent outbound HTTP requests for batch scraping
      - MAX_HTTP_BATCH_SIZE=1             # Maximum number of URLs processed per batch
      - ANALYZER_WORKER_POOL_SIZE=10 # Total background worker goroutines analyzing URLs for inaccessibility
      - HTTP_TIMEOUT=20s #http api endpoint timeout
      - LOG_LEVEL=DEBUG
    networks:
      - app-network
    restart: unless-stopped

  # Frontend Service (Placeholder React App)
  frontend:
    image: nginxdemos/hello:latest 
    container_name: url-analyzer-fe
    ports:
      - "3000:80" 
    networks:
      - app-network
    depends_on:
      - backend
    restart: unless-stopped


networks:
  app-network:
    driver: bridge